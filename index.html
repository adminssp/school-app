<!DOCTYPE html>
<html lang="ur" dir="rtl" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GBHS Mirpurkhas - School Digital Record</title>
  
  <!-- PWA Settings -->
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GBHS Mirpurkhas" />
  <meta name="description" content="School Digital Record for Government Boys High School Mirpurkhas" />

  <!-- Fonts: Google Plus Jakarta Sans & Noto Nastaliq Urdu -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            urdu: ['"Noto Nastaliq Urdu"', 'serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    .urdu-font { font-family: 'Noto Nastaliq Urdu', serif; line-height: 1.8; }
    * { transition: background-color 0.2s ease, border-color 0.2s ease; }
    ::-webkit-scrollbar { display: none; }
    html { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col antialiased">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const STORAGE_KEY_STUDENTS = 'gbhs_students_v1';
    const STORAGE_KEY_TEACHERS = 'gbhs_teachers_v1';
    const STORAGE_KEY_THEME = 'gbhs_theme';
    const STORAGE_KEY_LANG = 'gbhs_lang';

    const INITIAL_SCHOOL = {
      name: "Government Boys High School Mirpurkhas",
      nameUrdu: "گورنمنٹ بوائز ہائی اسکول میرپورخاص",
      nameSindhi: "گورنمينٽ بوائز هاءِ اسڪول ميرپورخاص",
      semisCode: "405030012",
      district: "Mirpurkhas (میرپورخاص)",
      headmaster: "Muhammad Hashim Mahar",
      headmasterPhone: "+92 300 1234567"
    };

    const INITIAL_TEACHERS = [
      { id: 'T-101', name: 'Muhammad Hashim Mahar', designation: 'Headmaster (BPS-19)', subject: 'Admin / English', phone: '0300-1234567', attendanceStatus: 'Present' },
      { id: 'T-102', name: 'Abdul Rasheed Lund', designation: 'Senior Science Teacher (BPS-17)', subject: 'Physics & Maths', phone: '0301-7654321', attendanceStatus: 'Present' },
      { id: 'T-103', name: 'Ghulam Qadir Soomro', designation: 'High School Teacher (BPS-16)', subject: 'Sindhi & Urdu', phone: '0333-9876543', attendanceStatus: 'Present' },
      { id: 'T-104', name: 'Kashif Ali Memon', designation: 'Junior School Teacher (BPS-14)', subject: 'Computer & Science', phone: '0312-3456789', attendanceStatus: 'Leave' },
      { id: 'T-105', name: 'Naveed Ahmed Qureshi', designation: 'Physical Education Teacher (BPS-15)', subject: 'Sports & PT', phone: '0345-5551234', attendanceStatus: 'Present' },
    ];

    const INITIAL_STUDENTS = [
      { grNo: '1420', name: 'Zubair Ahmed', fatherName: 'Ghulam Sarwar', classGrade: 'Class 10', section: 'A', dob: '2008-04-12', admissionDate: '2022-04-01', phone: '0301-1122334', bForm: '41201-1234567-1', address: 'Hirabad, Mirpurkhas', attendance: 'Present' },
      { grNo: '1421', name: 'Ali Raza Shar', fatherName: 'Muhammad Bux', classGrade: 'Class 10', section: 'A', dob: '2008-08-19', admissionDate: '2022-04-01', phone: '0302-2233445', bForm: '41201-2345678-3', address: 'Satellite Town, Mirpurkhas', attendance: 'Present' },
      { grNo: '1422', name: 'Farhan Khalid', fatherName: 'Khalid Mehmood', classGrade: 'Class 10', section: 'B', dob: '2009-01-05', admissionDate: '2022-04-02', phone: '0303-3344556', bForm: '41201-3456789-5', address: 'Station Road, Mirpurkhas', attendance: 'Absent' },
      { grNo: '1423', name: 'Danish Khan', fatherName: 'Arshad Khan', classGrade: 'Class 9', section: 'A', dob: '2009-06-14', admissionDate: '2023-04-05', phone: '0304-4455667', bForm: '41201-4567890-7', address: 'Tor Abad, Mirpurkhas', attendance: 'Present' },
      { grNo: '1424', name: 'Bilal Hussain', fatherName: 'Khadim Hussain', classGrade: 'Class 9', section: 'B', dob: '2009-11-23', admissionDate: '2023-04-05', phone: '0305-5566778', bForm: '41201-5678901-9', address: 'Jarwar Mohalla, Mirpurkhas', attendance: 'Present' },
      { grNo: '1425', name: 'Sajid Ali Laghari', fatherName: 'Mubeen Laghari', classGrade: 'Class 8', section: 'A', dob: '2010-03-17', admissionDate: '2024-04-01', phone: '0306-6677889', bForm: '41201-6789012-1', address: 'Pak Colony, Mirpurkhas', attendance: 'Leave' },
      { grNo: '1426', name: 'Imran Soomro', fatherName: 'Allah Dino', classGrade: 'Class 8', section: 'B', dob: '2010-09-30', admissionDate: '2024-04-01', phone: '0307-7788990', bForm: '41201-7890123-3', address: 'Gharibabad, Mirpurkhas', attendance: 'Present' },
      { grNo: '1427', name: 'Abdul Samad', fatherName: 'Niaz Muhammad', classGrade: 'Class 7', section: 'A', dob: '2011-02-14', admissionDate: '2025-04-01', phone: '0308-8899001', bForm: '41201-8901234-5', address: 'Mirwah Road, Mirpurkhas', attendance: 'Present' },
      { grNo: '1428', name: 'Tariq Aziz', fatherName: 'Abdul Aziz', classGrade: 'Class 6', section: 'A', dob: '2012-07-22', admissionDate: '2026-04-01', phone: '0309-9900112', bForm: '41201-9012345-7', address: 'Old Mirpurkhas', attendance: 'Present' }
    ];

    const TRANSLATIONS = {
      en: {
        dashboard: "Dashboard", grRegister: "G.R. Register", attendance: "Attendance", teachers: "Teachers", reports: "Reports", settings: "Settings",
        totalStudents: "Total Enrolled", presentToday: "Present Today", absentToday: "Absent", staffOnDuty: "Staff On Duty",
        quickActions: "Quick Actions", addStudent: "Add Student", markAttendance: "Mark Attendance",
        searchStudent: "Search by Name, G.R. #...", allClasses: "All Classes", viewProfile: "Profile", save: "Save", cancel: "Cancel", installApp: "Install App"
      },
      ur: {
        dashboard: "ڈیش بورڈ", grRegister: "جنرل رجسٹر", attendance: "روزانہ حاضری", teachers: "اساتذہ لسٹ", reports: "رپورٹس", settings: "ترتیبات",
        totalStudents: "کل طلباء", presentToday: "آج حاضر", absentToday: "غیر حاضر", staffOnDuty: "حاضر اساتذہ",
        quickActions: "فوری اقدامات", addStudent: "نیا طالب علم", markAttendance: "حاضری لگائیں",
        searchStudent: "نام یا جی آر سے تلاش کریں...", allClasses: "تمام کلاسز", viewProfile: "پروفائل", save: "محفوظ کریں", cancel: "منسوخ", installApp: "ایپ انسٹال کریں"
      },
      sd: {
        dashboard: "ڊيش بورڊ", grRegister: "جنرل رجسٽر", attendance: "روزاني حاضري", teachers: "استادن جي لسٽ", reports: "رپورٽون", settings: "سيٽنگون",
        totalStudents: "ڪل شاگرد", presentToday: "اڄ حاضر", absentToday: "غير حاضر", staffOnDuty: "حاضر استاد",
        quickActions: "جلدي ڪم", addStudent: "نئون شاگرد", markAttendance: "حاضري لڳايو",
        searchStudent: "شاگرد ڳوليو...", allClasses: "سڀ ڪلاس", viewProfile: "پروفائل", save: "محفوظ", cancel: "رد", installApp: "ايپ انسٽال ڪريو"
      }
    };

    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem(STORAGE_KEY_LANG) || 'ur');
      const [isDark, setIsDark] = useState(() => localStorage.getItem(STORAGE_KEY_THEME) === 'dark');
      const [activeTab, setActiveTab] = useState('dashboard');
      
      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY_STUDENTS);
        return saved ? JSON.parse(saved) : INITIAL_STUDENTS;
      });

      const [teachers, setTeachers] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY_TEACHERS);
        return saved ? JSON.parse(saved) : INITIAL_TEACHERS;
      });

      const [selectedStudent, setSelectedStudent] = useState(null);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState('');
      const [classFilter, setClassFilter] = useState('All');
      const [toastMsg, setToastMsg] = useState('');
      const [deferredPrompt, setDeferredPrompt] = useState(null);

      const [studentForm, setStudentForm] = useState({
        grNo: '', name: '', fatherName: '', classGrade: 'Class 10', section: 'A',
        dob: '2009-01-01', admissionDate: new Date().toISOString().split('T')[0],
        phone: '0300-0000000', bForm: '', address: 'Mirpurkhas', attendance: 'Present'
      });

      useEffect(() => { localStorage.setItem(STORAGE_KEY_STUDENTS, JSON.stringify(students)); }, [students]);
      useEffect(() => { localStorage.setItem(STORAGE_KEY_TEACHERS, JSON.stringify(teachers)); }, [teachers]);
      useEffect(() => {
        localStorage.setItem(STORAGE_KEY_THEME, isDark ? 'dark' : 'light');
        if (isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDark]);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY_LANG, lang);
        document.documentElement.setAttribute('dir', lang === 'en' ? 'ltr' : 'rtl');
      }, [lang]);

      useEffect(() => {
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        });
      }, []);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      const handleInstallApp = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          setDeferredPrompt(null);
        } else {
          showToast('کروم مینو (⋮) میں جا کر "Add to Home screen" پر ٹیپ کریں۔');
        }
      };

      const t = TRANSLATIONS[lang] || TRANSLATIONS.ur;

      const filteredStudents = useMemo(() => {
        return students.filter(st => {
          const matchSearch = st.name.toLowerCase().includes(searchTerm.toLowerCase()) || st.grNo.includes(searchTerm) || st.fatherName.toLowerCase().includes(searchTerm.toLowerCase());
          const matchClass = classFilter === 'All' || st.classGrade === classFilter;
          return matchSearch && matchClass;
        });
      }, [students, searchTerm, classFilter]);

      const totalStudentsCount = students.length;
      const presentStudentsCount = students.filter(s => s.attendance === 'Present').length;
      const absentStudentsCount = students.filter(s => s.attendance === 'Absent').length;
      const presentTeachersCount = teachers.filter(t => t.attendanceStatus === 'Present').length;
      const attendancePercent = totalStudentsCount > 0 ? Math.round((presentStudentsCount / totalStudentsCount) * 100) : 0;

      const handleSaveStudent = (e) => {
        e.preventDefault();
        if (!studentForm.grNo || !studentForm.name || !studentForm.fatherName) {
          showToast('تمام خانے پر کریں۔');
          return;
        }
        const idx = students.findIndex(s => s.grNo === studentForm.grNo);
        if (idx >= 0) {
          const updated = [...students];
          updated[idx] = studentForm;
          setStudents(updated);
          showToast('ریکارڈ اپ ڈیٹ ہو گیا!');
        } else {
          setStudents([studentForm, ...students]);
          showToast('نیا طالب علم شامل ہو گیا!');
        }
        setIsAddModalOpen(false);
      };

      const toggleStudentAttendance = (grNo, status) => {
        setStudents(prev => prev.map(s => s.grNo === grNo ? { ...s, attendance: status } : s));
      };

      const toggleTeacherAttendance = (id, status) => {
        setTeachers(prev => prev.map(tc => tc.id === id ? { ...tc, attendanceStatus: status } : tc));
      };

      return (
        <div className={`flex flex-col min-h-screen pb-20 ${lang !== 'en' ? 'urdu-font' : ''}`}>
          
          {/* Header */}
          <header className="sticky top-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-3 shadow-xs">
            <div className="max-w-3xl mx-auto flex items-center justify-between gap-2">
              <div className="flex items-center gap-2.5 min-w-0">
                <div className="w-10 h-10 rounded-2xl bg-blue-600 text-white flex items-center justify-center font-black text-lg flex-shrink-0">
                  GB
                </div>
                <div className="flex flex-col min-w-0">
                  <h1 className="text-xs sm:text-sm font-extrabold text-slate-900 dark:text-white truncate">
                    {lang === 'ur' ? INITIAL_SCHOOL.nameUrdu : lang === 'sd' ? INITIAL_SCHOOL.nameSindhi : INITIAL_SCHOOL.name}
                  </h1>
                  <span className="text-[10px] font-bold text-amber-600 dark:text-amber-400 font-mono">
                    SEMIS: 405030012 • Mirpurkhas
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-1.5 flex-shrink-0">
                <div className="flex bg-slate-100 dark:bg-slate-800 p-0.5 rounded-xl text-[10px] font-bold">
                  <button onClick={() => setLang('ur')} className={`px-2 py-1 rounded-lg ${lang === 'ur' ? 'bg-blue-600 text-white' : 'text-slate-600 dark:text-slate-400'}`}>اردو</button>
                  <button onClick={() => setLang('sd')} className={`px-2 py-1 rounded-lg ${lang === 'sd' ? 'bg-blue-600 text-white' : 'text-slate-600 dark:text-slate-400'}`}>سنڌي</button>
                  <button onClick={() => setLang('en')} className={`px-2 py-1 rounded-lg ${lang === 'en' ? 'bg-blue-600 text-white' : 'text-slate-600 dark:text-slate-400'}`}>EN</button>
                </div>
                <button onClick={() => setIsDark(!isDark)} className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs">
                  {isDark ? '☀️' : '🌙'}
                </button>
              </div>
            </div>
          </header>

          {/* Main Body */}
          <main className="flex-1 max-w-3xl w-full mx-auto p-4 space-y-4">
            
            {/* Install PWA Banner */}
            <div className="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-3 text-white shadow-md flex items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <span className="text-xl">📱</span>
                <div>
                  <h2 className="text-xs font-bold">{t.installApp}</h2>
                  <p className="text-[9px] text-blue-100">بغیر انٹرنیٹ کے موبائل پر چلائیں</p>
                </div>
              </div>
              <button onClick={handleInstallApp} className="px-3 py-1 bg-white text-blue-700 rounded-xl text-xs font-extrabold">
                انسٹال کریں
              </button>
            </div>

            {/* TAB: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4">
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                  <div className="bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800">
                    <span className="text-[10px] text-slate-500 block">{t.totalStudents}</span>
                    <span className="text-2xl font-extrabold text-blue-600 font-mono mt-1 block">{totalStudentsCount}</span>
                  </div>
                  <div className="bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800">
                    <span className="text-[10px] text-slate-500 block">{t.presentToday}</span>
                    <span className="text-2xl font-extrabold text-emerald-600 font-mono mt-1 block">{presentStudentsCount}</span>
                  </div>
                  <div className="bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800">
                    <span className="text-[10px] text-slate-500 block">{t.absentToday}</span>
                    <span className="text-2xl font-extrabold text-rose-600 font-mono mt-1 block">{absentStudentsCount}</span>
                  </div>
                  <div className="bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800">
                    <span className="text-[10px] text-slate-500 block">{t.staffOnDuty}</span>
                    <span className="text-2xl font-extrabold text-indigo-600 font-mono mt-1 block">{presentTeachersCount} / {teachers.length}</span>
                  </div>
                </div>

                <div className="bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-2">
                  <h3 className="text-xs font-bold text-slate-400 uppercase">{t.quickActions}</h3>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    <button onClick={() => setIsAddModalOpen(true)} className="p-2.5 bg-blue-50 dark:bg-blue-950/60 text-blue-700 dark:text-blue-300 rounded-xl text-xs font-bold flex flex-col items-center gap-1">
                      <span>➕</span><span>{t.addStudent}</span>
                    </button>
                    <button onClick={() => setActiveTab('attendance')} className="p-2.5 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 rounded-xl text-xs font-bold flex flex-col items-center gap-1">
                      <span>📋</span><span>{t.markAttendance}</span>
                    </button>
                    <button onClick={() => setActiveTab('gr')} className="p-2.5 bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 rounded-xl text-xs font-bold flex flex-col items-center gap-1">
                      <span>📖</span><span>{t.grRegister}</span>
                    </button>
                    <button onClick={() => setActiveTab('reports')} className="p-2.5 bg-purple-50 dark:bg-purple-950/60 text-purple-700 dark:text-purple-300 rounded-xl text-xs font-bold flex flex-col items-center gap-1">
                      <span>📊</span><span>{t.reports}</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: G.R. REGISTER */}
            {activeTab === 'gr' && (
              <div className="space-y-3">
                <div className="flex gap-2">
                  <input
                    type="text"
                    placeholder={t.searchStudent}
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="flex-1 px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs"
                  />
                  <button onClick={() => setIsAddModalOpen(true)} className="px-3 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">
                    ➕ شامل کریں
                  </button>
                </div>

                <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 divide-y divide-slate-100 dark:divide-slate-800">
                  {filteredStudents.map(st => (
                    <div key={st.grNo} className="p-3 flex items-center justify-between gap-2">
                      <div>
                        <h4 className="text-xs font-bold">{st.name}</h4>
                        <p className="text-[10px] text-slate-500">GR #{st.grNo} • ولد: {st.fatherName} ({st.classGrade})</p>
                      </div>
                      <button onClick={() => setSelectedStudent(st)} className="px-2.5 py-1 bg-blue-50 dark:bg-blue-950 text-blue-600 rounded-xl text-xs font-bold">
                        پروفائل
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: ATTENDANCE */}
            {activeTab === 'attendance' && (
              <div className="space-y-3">
                <div className="flex justify-between items-center bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800">
                  <span className="text-xs font-bold">روزانہ حاضری مارکنگ</span>
                  <button onClick={() => { setStudents(prev => prev.map(s => ({ ...s, attendance: 'Present' }))); showToast('سب حاضر!'); }} className="px-2.5 py-1 bg-emerald-100 text-emerald-800 rounded-xl text-xs font-bold">
                    سب حاضر
                  </button>
                </div>
                <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 divide-y divide-slate-100 dark:divide-slate-800">
                  {students.map(st => (
                    <div key={st.grNo} className="p-3 flex items-center justify-between">
                      <span className="text-xs font-bold">{st.name} <span className="text-[10px] text-slate-400 font-normal">({st.classGrade})</span></span>
                      <div className="flex gap-1">
                        <button onClick={() => toggleStudentAttendance(st.grNo, 'Present')} className={`px-2.5 py-1 rounded-xl text-xs font-bold ${st.attendance === 'Present' ? 'bg-emerald-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}`}>P</button>
                        <button onClick={() => toggleStudentAttendance(st.grNo, 'Absent')} className={`px-2.5 py-1 rounded-xl text-xs font-bold ${st.attendance === 'Absent' ? 'bg-rose-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}`}>A</button>
                        <button onClick={() => toggleStudentAttendance(st.grNo, 'Leave')} className={`px-2.5 py-1 rounded-xl text-xs font-bold ${st.attendance === 'Leave' ? 'bg-amber-500 text-white' : 'bg-slate-100 dark:bg-slate-800'}`}>L</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: TEACHERS */}
            {activeTab === 'teachers' && (
              <div className="space-y-2.5">
                {teachers.map(tc => (
                  <div key={tc.id} className="bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 flex items-center justify-between">
                    <div>
                      <h4 className="text-xs font-bold">{tc.name}</h4>
                      <p className="text-[10px] text-slate-500">{tc.designation} • {tc.subject}</p>
                      <p className="text-[9px] text-slate-400">📞 {tc.phone}</p>
                    </div>
                    <button onClick={() => toggleTeacherAttendance(tc.id, tc.attendanceStatus === 'Present' ? 'Leave' : 'Present')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${tc.attendanceStatus === 'Present' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>
                      {tc.attendanceStatus === 'Present' ? 'حاضر' : 'رخصت'}
                    </button>
                  </div>
                ))}
              </div>
            )}

            {/* TAB: REPORTS */}
            {activeTab === 'reports' && (
              <div className="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3">
                <h3 className="text-xs font-bold">اسکول رپورٹ</h3>
                <div className="grid grid-cols-2 gap-2 text-xs">
                  <div className="p-2.5 bg-slate-50 dark:bg-slate-800 rounded-xl">
                    <span className="text-[10px] text-slate-400">کل طلباء</span>
                    <span className="block font-bold text-blue-600">{totalStudentsCount}</span>
                  </div>
                  <div className="p-2.5 bg-slate-50 dark:bg-slate-800 rounded-xl">
                    <span className="text-[10px] text-slate-400">حاضری فیصد</span>
                    <span className="block font-bold text-emerald-600">{attendancePercent}%</span>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: SETTINGS */}
            {activeTab === 'settings' && (
              <div className="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 text-xs space-y-2">
                <h3 className="font-bold">اسکول پروفائل</h3>
                <p><strong>اسکول:</strong> {INITIAL_SCHOOL.name}</p>
                <p><strong>SEMIS کوڈ:</strong> {INITIAL_SCHOOL.semisCode}</p>
                <p><strong>ہیڈ ماسٹر:</strong> {INITIAL_SCHOOL.headmaster}</p>
              </div>
            )}

          </main>

          {/* Student Profile Modal */}
          {selectedStudent && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-xs w-full p-5 space-y-3">
                <h3 className="text-xs font-bold pb-1 border-b">طالب علم پروفائل</h3>
                <div className="text-center">
                  <h4 className="font-bold text-sm">{selectedStudent.name}</h4>
                  <p className="text-xs text-slate-500">ولد: {selectedStudent.fatherName}</p>
                </div>
                <div className="text-xs space-y-1 bg-slate-50 dark:bg-slate-800 p-3 rounded-xl">
                  <p>G.R #: <strong>{selectedStudent.grNo}</strong></p>
                  <p>Class: <strong>{selectedStudent.classGrade}</strong></p>
                  <p>Phone: <strong>{selectedStudent.phone}</strong></p>
                  <p>Address: <strong>{selectedStudent.address}</strong></p>
                </div>
                <button onClick={() => setSelectedStudent(null)} className="w-full py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">بند کریں</button>
              </div>
            </div>
          )}

          {/* Add Student Modal */}
          {isAddModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-sm w-full p-5 space-y-3">
                <h3 className="text-xs font-bold pb-1 border-b">نیا طالب علم (G.R. Entry)</h3>
                <form onSubmit={handleSaveStudent} className="space-y-2 text-xs">
                  <input type="text" placeholder="G.R. Number" required value={studentForm.grNo} onChange={e => setStudentForm({...studentForm, grNo: e.target.value})} className="w-full p-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" />
                  <input type="text" placeholder="طالب علم کا نام" required value={studentForm.name} onChange={e => setStudentForm({...studentForm, name: e.target.value})} className="w-full p-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" />
                  <input type="text" placeholder="والد کا نام" required value={studentForm.fatherName} onChange={e => setStudentForm({...studentForm, fatherName: e.target.value})} className="w-full p-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" />
                  <select value={studentForm.classGrade} onChange={e => setStudentForm({...studentForm, classGrade: e.target.value})} className="w-full p-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                    <option>Class 10</option><option>Class 9</option><option>Class 8</option><option>Class 7</option><option>Class 6</option>
                  </select>
                  <div className="flex gap-2 pt-2">
                    <button type="submit" className="flex-1 py-2 bg-blue-600 text-white rounded-xl font-bold">محفوظ کریں</button>
                    <button type="button" onClick={() => setIsAddModalOpen(false)} className="px-3 py-2 bg-slate-200 dark:bg-slate-700 rounded-xl">منسوخ</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Toast */}
          {toastMsg && (
            <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs px-4 py-2 rounded-2xl shadow-xl">
              ✅ {toastMsg}
            </div>
          )}

          {/* Bottom Bar */}
          <nav className="fixed bottom-0 inset-x-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 px-3 py-1.5 flex items-center justify-around shadow-lg">
            <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'dashboard' ? 'text-blue-600' : 'text-slate-400'}`}><span>📊</span><span>{t.dashboard}</span></button>
            <button onClick={() => setActiveTab('gr')} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'gr' ? 'text-blue-600' : 'text-slate-400'}`}><span>📖</span><span>{t.grRegister}</span></button>
            <button onClick={() => setActiveTab('attendance')} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'attendance' ? 'text-blue-600' : 'text-slate-400'}`}><span>📋</span><span>{t.attendance}</span></button>
            <button onClick={() => setActiveTab('teachers')} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'teachers' ? 'text-blue-600' : 'text-slate-400'}`}><span>👨‍🏫</span><span>{t.teachers}</span></button>
            <button onClick={() => setActiveTab('reports')} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'reports' ? 'text-blue-600' : 'text-slate-400'}`}><span>📑</span><span>{t.reports}</span></button>
            <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'settings' ? 'text-blue-600' : 'text-slate-400'}`}><span>⚙️</span><span>{t.settings}</span></button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
